    split_source: release
    metadata: /PATH/Datasets/MIMIC-CXR-JPG/meta/mimic-cxr-2.0.0-metadata.csv.gz
    split: /PATH/Datasets/MIMIC-CXR-JPG/meta/mimic-cxr-2.0.0-split.csv.gz
    reports_zip: /PATH/CXR/data/mimic/mimic-cxr-reports.zip
